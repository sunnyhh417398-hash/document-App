<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公文系統</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 登入畫面 -->
  <div class="login-screen" id="login-screen" hidden>
    <form class="login-box" id="login-form">
      <div class="login-logo">📜</div>
      <h1>公文系統</h1>
      <p class="login-sub">請登入以使用系統</p>
      <label>帳號<input type="text" id="login-username" autocomplete="username" required /></label>
      <label>密碼<input type="password" id="login-password" autocomplete="current-password" required /></label>
      <p class="form-error" id="login-error" hidden></p>
      <button type="submit" class="btn btn-act login-btn">登入</button>
      <p class="login-hint">預設帳號：admin / clerk / boss / staff（密碼為帳號 +123）</p>
    </form>
  </div>

  <div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="logo">📜</span>
      <div>
        <h1>公文系統</h1>
        <p class="subtitle">公文製作 · 簽核流程 · 收發管理</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btn-users" class="btn" hidden>使用者管理</button>
      <button id="btn-audit" class="btn" hidden>稽核軌跡</button>
      <button id="btn-new" class="btn btn-primary">＋ 新增公文</button>
      <span class="user-chip" id="user-chip"></span>
      <button id="btn-password" class="btn btn-ghost">改密碼</button>
      <button id="btn-logout" class="btn btn-ghost">登出</button>
    </div>
  </header>

  <section class="stats" id="stats"><!-- 統計卡片 --></section>

  <section class="toolbar">
    <input type="search" id="search" placeholder="搜尋主旨 / 文號 / 受文者 / 承辦人…" />
    <select id="filter-direction"><option value="">收發別</option></select>
    <select id="filter-status"><option value="">全部狀態</option></select>
    <select id="filter-type"><option value="">全部類別</option></select>
    <select id="filter-due">
      <option value="">限辦狀態</option>
      <option value="overdue">已逾期</option>
      <option value="soon">即將到期</option>
    </select>
  </section>

  <main>
    <table class="doc-table">
      <thead>
        <tr>
          <th>文號</th><th>文向</th><th>類別</th><th>主旨</th><th>受文者／來文者</th>
          <th>速別</th><th>承辦人</th><th>限辦日期</th><th>狀態</th><th>更新時間</th>
        </tr>
      </thead>
      <tbody id="doc-list">
        <tr><td colspan="10" class="empty">載入中…</td></tr>
      </tbody>
    </table>
  </main>

  <!-- 編輯 / 新增 對話框 -->
  <div class="modal-backdrop" id="modal-edit" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2 id="edit-title">新增公文</h2>
        <button class="btn-close" data-close>✕</button>
      </div>
      <form id="doc-form" class="modal-body">
        <input type="hidden" id="f-id" />
        <div class="grid">
          <label>收發別<select id="f-direction"></select></label>
          <label>公文類別<select id="f-type"></select></label>
          <label>速別<select id="f-priority"></select></label>
        </div>
        <div class="grid">
          <label>密等<select id="f-classification"></select></label>
          <label>承辦人<input type="text" id="f-handler" placeholder="姓名" /></label>
          <label>限辦日期<input type="date" id="f-dueDate" /></label>
        </div>

        <!-- 收文專屬欄位 -->
        <fieldset id="incoming-fields" class="subform" hidden>
          <legend>來文資訊</legend>
          <div class="grid">
            <label>來文機關<input type="text" id="f-incomingFrom" placeholder="來文機關 / 單位" /></label>
            <label>來文字號<input type="text" id="f-incomingNumber" placeholder="對方發文字號" /></label>
            <label>來文日期<input type="date" id="f-incomingDate" /></label>
          </div>
        </fieldset>

        <label>主旨 <span class="req">*</span>
          <input type="text" id="f-subject" required maxlength="200" placeholder="例：函送本年度預算執行報告" />
        </label>
        <div class="grid grid-2">
          <label>發文者<input type="text" id="f-sender" placeholder="發文機關 / 單位" /></label>
          <label>受文者<input type="text" id="f-recipient" placeholder="收文機關 / 單位" /></label>
        </div>
        <label>本文 / 說明
          <textarea id="f-body" rows="6" placeholder="一、…&#10;二、…"></textarea>
        </label>

        <!-- 會簽多關卡 -->
        <fieldset class="subform">
          <legend>會簽路徑（可選，逐關核章）</legend>
          <div id="route-rows"></div>
          <button type="button" class="btn btn-sm" id="btn-add-stage">＋ 新增關卡</button>
          <p class="hint">未設定關卡時採單關「核定」；設定後須逐關核章方可核定。</p>
        </fieldset>

        <p class="form-error" id="form-error" hidden></p>
        <div class="modal-foot">
          <button type="button" class="btn" data-close>取消</button>
          <button type="submit" class="btn btn-primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 檢視 / 簽核 對話框 -->
  <div class="modal-backdrop" id="modal-view" hidden>
    <div class="modal modal-wide">
      <div class="modal-head">
        <h2>公文檢視</h2>
        <button class="btn-close" data-close>✕</button>
      </div>
      <div class="modal-body" id="view-body"><!-- 動態 --></div>
    </div>
  </div>

  <!-- 稽核軌跡 對話框 -->
  <div class="modal-backdrop" id="modal-audit" hidden>
    <div class="modal modal-wide">
      <div class="modal-head">
        <h2>稽核軌跡</h2>
        <div>
          <button class="btn btn-act btn-sm" id="btn-audit-export">⤓ 匯出 CSV</button>
          <button class="btn-close" data-close>✕</button>
        </div>
      </div>
      <div class="modal-body">
        <table class="mini-table" id="audit-table">
          <thead><tr><th>時間</th><th>操作者</th><th>角色</th><th>動作</th><th>對象</th><th>說明</th></tr></thead>
          <tbody id="audit-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 使用者管理 對話框 -->
  <div class="modal-backdrop" id="modal-users" hidden>
    <div class="modal modal-wide">
      <div class="modal-head">
        <h2>使用者管理</h2>
        <div>
          <button class="btn btn-act btn-sm" id="btn-add-user">＋ 新增使用者</button>
          <button class="btn-close" data-close>✕</button>
        </div>
      </div>
      <div class="modal-body">
        <form id="add-user-form" class="subform" hidden>
          <legend>新增使用者</legend>
          <div class="grid">
            <label>帳號<input type="text" id="u-username" autocomplete="off" /></label>
            <label>姓名<input type="text" id="u-name" /></label>
            <label>角色<select id="u-role"></select></label>
          </div>
          <div class="grid grid-2">
            <label>密碼<input type="password" id="u-password" autocomplete="new-password" placeholder="至少 6 碼" /></label>
            <div class="user-add-actions">
              <button type="submit" class="btn btn-primary">建立</button>
              <button type="button" class="btn" id="u-cancel">取消</button>
            </div>
          </div>
          <p class="form-error" id="user-form-error" hidden></p>
        </form>
        <table class="mini-table" id="users-table">
          <thead><tr><th>姓名</th><th>帳號</th><th>角色</th><th>狀態</th><th>操作</th></tr></thead>
          <tbody id="users-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 修改自己密碼 對話框 -->
  <div class="modal-backdrop" id="modal-password" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>修改密碼</h2>
        <button class="btn-close" data-close>✕</button>
      </div>
      <form class="modal-body" id="password-form">
        <label>目前密碼<input type="password" id="p-current" autocomplete="current-password" required /></label>
        <label>新密碼<input type="password" id="p-new" autocomplete="new-password" required placeholder="至少 6 碼" /></label>
        <label>確認新密碼<input type="password" id="p-confirm" autocomplete="new-password" required /></label>
        <p class="form-error" id="password-error" hidden></p>
        <div class="modal-foot">
          <button type="button" class="btn" data-close>取消</button>
          <button type="submit" class="btn btn-primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  </div><!-- /#app -->

  <script src="app.js"></script>
</body>
</html>
